<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>
</head>
<body>
    <header id="header-container">
        <h1>Battleship</h1>
    </header>

    <main id="main-container">

        <div id="game-controls">
            <button type="button" id="game-reset">Reset</button>
            <button type="button" id="randomize-ship">Randomize</button>
            <button type="button" id="game-start">Start</button>
        </div>
        <div id="gameboards">
            <div id="player-details">
                <h2 id="player-name">Player-1</h2>
                <div id="player-board" class="board"></div>
            </div>
            <div id="computer-details">
                <h2 id="computer-name">Computer</h2>
                <div id="computer-board" class="board"></div>
            </div>
        </div>

        <div id="setup-area">
            <div id="storage-board">

            </div>
        </div>
    </main>

    <footer id="footer-container">
        <p>GGihan @ Github</p>
    </footer>
</body>
</html>
